<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kantin Kampus</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ================= LOGIN ================= -->
<div id="loginPage" class="login-page">
    <div class="login-box" id="loginBox">
        <h1>🍔 Kantin Kampus</h1>
        <p>Silakan login untuk masuk</p>

        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">

        <button onclick="login()">Login</button>

        <p id="loginError"></p>

        <p class="switch-form">
            Belum punya akun?
            <a href="#" onclick="tampilkanRegister(); return false;">Daftar di sini</a>
        </p>
    </div>

    <!-- FORM BUAT AKUN -->
    <div class="login-box" id="registerBox" style="display:none;">
        <h1>📝 Buat Akun</h1>
        <p>Daftar sebagai pembeli</p>

        <input type="text" id="regUsername" placeholder="Username">
        <input type="password" id="regPassword" placeholder="Password (minimal 4 karakter)">
        <input type="password" id="regPassword2" placeholder="Ulangi password">

        <button onclick="daftar()">Buat Akun</button>

        <p id="registerError"></p>

        <p class="switch-form">
            Sudah punya akun?
            <a href="#" onclick="tampilkanLogin(); return false;">Kembali ke login</a>
        </p>
    </div>
</div>
